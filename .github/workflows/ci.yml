name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python asset tooling
        run: python -m pip install -r scripts/requirements-assets.txt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux windowing and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            vulkan-tools \
            weston \
            pkg-config \
            xvfb \
            xauth

      - name: Configure Linux software Vulkan adapter
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/setup-ci-vulkan.sh

      - name: Install macOS Vulkan runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install molten-vk vulkan-loader vulkan-tools
          source scripts/setup-macos-vulkan.sh
          vulkaninfo --summary

      - name: Configure Windows software Vulkan adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup-ci-vulkan.ps1

      - name: Validate
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\ci.ps1

      - name: Validate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci.sh

      - name: Validate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/setup-macos-vulkan.sh
          source scripts/ci.sh

      - name: Validate animated Vulkan handoff (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --example backend_switch_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-vulkan-handoff.py --binary target/debug/examples/backend_switch_probe.exe

      - name: Validate animated Vulkan handoff (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --example backend_switch_probe
          WINIT_UNIX_BACKEND=x11 xvfb-run -a python scripts/check-vulkan-handoff.py --binary target/debug/examples/backend_switch_probe

      - name: Validate animated Vulkan handoff (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source scripts/setup-macos-vulkan.sh
          cargo build --example backend_switch_probe
          python scripts/check-vulkan-handoff.py --binary target/debug/examples/backend_switch_probe

      - name: Validate Wayland Vulkan handoff and sustained rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --release --example backend_switch_probe
          python scripts/check-wayland-vulkan.py --binary target/release/examples/backend_switch_probe
